<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoSmoke · Jardin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F4EFE6; --ink:#2F3A2E; --terra:#C47A57;
  --paper:#FBF8F2; --line:#D9D1C1; --muted:#6E6A5E;
  --serif:"Fraunces", Georgia, serif;
  --sans:"Inter", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding:56px 16px 96px;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.page-head{max-width:1320px;margin:0 auto 56px;text-align:center}
.page-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,52px);letter-spacing:-.01em}
.page-head p{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.5}

.row-sec{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:64px 48px;max-width:1360px;margin:0 auto 88px}
figure{display:flex;flex-direction:column;align-items:center;padding:8px}
figcaption{margin-top:28px;max-width:390px;text-align:center;font-size:14px;line-height:1.5;color:var(--muted)}
figcaption b{color:var(--ink);font-weight:600}

/* ---------- phone ---------- */
.phone{position:relative;flex:none;width:390px;height:844px;border-radius:48px;background:var(--cream);
  box-shadow:0 0 0 8px var(--ink),0 40px 70px -30px rgba(47,58,46,.45);overflow:hidden;display:flex;flex-direction:column}
.status{position:relative;flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:16px}
.island{position:absolute;top:11px;left:50%;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:var(--ink)}
.status-icons{display:flex;gap:6px;align-items:center}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 24px 32px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabbar{flex:none;position:relative;height:86px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-top:9px;background:var(--cream)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--terra)}
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}

/* ---------- type ---------- */
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
.title{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;margin-top:6px}
.sub{margin-top:8px;font-size:15px;line-height:1.45;color:var(--muted)}
.serif-m{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.25}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.45}
.center{text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:999px;background:var(--terra);color:var(--paper);font-weight:600;font-size:16px}
.btn.ghost{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.link{color:var(--terra);font-weight:500;font-size:15px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* ---------- characters ---------- */
.ch{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch svg *{transform-box:view-box}

/* ---------- A. Aujourd'hui ---------- */
.day{font-family:var(--serif);font-weight:500;font-size:52px;line-height:1;margin-top:8px;letter-spacing:-.01em}
.since{font-family:var(--serif);font-style:italic;font-size:22px;margin-top:6px}
.lead{margin-top:12px;font-size:15px;color:var(--muted)}
.hero{width:250px;margin:22px auto 6px}
.stages{display:flex;gap:6px;width:150px;margin:12px auto 0}
.stages span{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.stages i{display:block;height:100%;width:8%;background:var(--terra);border-radius:2px}
.stage-cap{margin-top:8px;font-size:12px;color:var(--muted);text-align:center}
.micro-row{display:flex;gap:18px;align-items:center}
.micro-row .ch{width:116px;flex:none}
.recharge{display:flex;align-items:center;gap:10px;margin-top:14px}
.recharge svg{width:44px;height:44px;flex:none}
.recharge span{font-size:12px;line-height:1.35;color:var(--muted)}
.recharge b{color:var(--ink);font-weight:600}
.quiet{display:flex;gap:16px;align-items:center;padding:14px 0}
.quiet + .quiet{border-top:1px solid var(--line)}
.quiet .ch{width:60px;flex:none}
.quiet p{font-size:14.5px;line-height:1.45}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--terra)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:3%;min-width:5px;background:var(--terra);border-radius:2px}

/* ---------- strips ---------- */
.col{display:flex;flex-direction:column;gap:56px;flex:1 1 520px;max-width:860px;min-width:0}
.strip{width:100%;padding:0}
.strip-in{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:32px;padding:32px 24px 28px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:28px 20px}
.state{display:flex;flex-direction:column;align-items:center;text-align:center}
.state .ch{width:100%;max-width:190px}
.state .tag{margin-top:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.state p{margin-top:6px;font-size:14px;line-height:1.45;max-width:210px}
.strip figcaption{max-width:560px}
.micro-states{grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.micro-states .ch{max-width:120px}

/* ---------- D. Respirer ---------- */
.breath{position:relative;width:244px;height:244px;margin:20px auto 0}
.breath > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.guide{transform-box:view-box;transform-origin:122px 122px;transform:scale(.86)}
.breathing .guide{animation:guide 10s cubic-bezier(.45,0,.55,1) infinite}
@keyframes guide{0%,100%{transform:scale(.8)}40%{transform:scale(1)}}
.cloud-out{position:absolute;left:50%;top:50%;width:132px;margin:-45px 0 0 -66px;transition:transform 1.4s cubic-bezier(.5,0,.75,0),opacity 1.4s cubic-bezier(.5,0,.75,0)}
.cloud-out.away{opacity:0}
.breathing .cloud-in{animation:inflate 10s cubic-bezier(.45,0,.55,1) infinite}
@keyframes inflate{0%,100%{transform:scale(.9)}40%{transform:scale(1.12)}}
.crossed{position:absolute;left:0;right:0;top:50%;margin-top:-12px;text-align:center;font-family:var(--serif);font-size:22px;color:var(--terra);opacity:0;transition:opacity .6s .8s}
.crossed.show{opacity:1}
.timer{font-family:var(--serif);font-weight:500;font-size:56px;line-height:1;text-align:center;margin-top:14px;font-variant-numeric:tabular-nums}
.phase{text-align:center;font-size:14px;color:var(--muted);margin-top:8px}
.ideas{list-style:none;margin-top:6px}
.ideas li{display:flex;align-items:center;gap:14px;padding:11px 0;font-size:15px}
.ideas li + li{border-top:1px solid var(--line)}
.ideas svg{width:22px;height:22px;flex:none;color:var(--ink)}
.links{display:flex;justify-content:space-between;margin-top:18px}

/* ---------- E. Journal ---------- */
.clouds{display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px;height:64px}
.cl-opt{display:flex;flex-direction:column;align-items:center}
.cl-opt .ch{display:block}
.cl-lbl{height:20px;margin-top:16px;font-size:13px;font-weight:600;color:var(--terra);display:flex;justify-content:center;white-space:nowrap}
.label{font-size:13px;font-weight:600;color:var(--muted);margin-top:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px 0 10px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;color:var(--ink)}
.chip svg{width:16px;height:16px;flex:none}
.chip.on{background:var(--terra);border-color:var(--terra);color:var(--paper)}
.reply{margin-top:10px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;font-size:14px;line-height:1.45}
.chart{display:block;width:100%;height:auto;margin-top:14px}

/* ---------- F. Plan ---------- */
.timeline{list-style:none;margin-top:22px}
.step{position:relative;padding:0 0 26px 30px}
.step::before{content:"";position:absolute;left:5px;top:20px;bottom:-2px;width:1.5px;background:var(--line)}
.step:last-child::before{display:none}
.step .dot{position:absolute;left:0;top:6px;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:var(--cream)}
.step.now .dot{background:var(--terra);border-color:var(--terra);box-shadow:0 0 0 4px var(--cream),0 0 0 5.5px var(--terra)}
.step-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--serif);font-weight:500;font-size:19px}
.here{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--terra)}
.step-s{margin-top:4px;font-size:14px;line-height:1.45;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:10px;margin-top:10px}
.lbl{width:56px;font-size:13px;font-weight:600}
.seg{display:inline-flex;padding:2px;border:1.5px solid var(--line);border-radius:999px}
.seg button{width:42px;height:28px;border-radius:999px;font-size:14px;font-weight:500}
.seg button.on{background:var(--ink);color:var(--paper)}
.unit{font-size:13px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
.stepper span{min-width:64px;text-align:center;font-size:14px;font-weight:500}
.facts{list-style:none}
.facts li{display:flex;gap:16px;padding:12px 0;font-size:14.5px;line-height:1.4}
.facts li + li{border-top:1px solid var(--line)}
.facts span:first-child{color:var(--muted);flex:none;width:112px}

/* ---------- G. Widgets ---------- */
.home-bg{background:radial-gradient(120% 80% at 50% 20%,var(--paper),var(--cream))}
.home{flex:1;padding:14px 24px 0;display:flex;flex-direction:column}
.w-row{display:flex;justify-content:space-between}
.widget{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 24px -16px rgba(47,58,46,.35)}
.w-s{width:160px;height:160px;padding:14px 14px 12px;display:flex;flex-direction:column;cursor:pointer}
.w-s .ch{width:130px;margin:4px auto 0}
.w-s .serif-m{margin-top:auto;font-size:22px}
.w-m{position:relative;width:342px;height:160px;margin-top:22px;padding:12px 18px;display:flex;align-items:center;gap:20px}
.w-m .ch{width:104px;flex:none}
.w-m .big{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1}
.plus{position:absolute;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;background:var(--terra);color:var(--paper);display:flex;align-items:center;justify-content:center}
.apps{display:grid;grid-template-columns:repeat(2,62px);gap:18px 36px;align-content:start}
.app{width:62px;height:62px;border-radius:16px;background:var(--line)}
.apps4{display:grid;grid-template-columns:repeat(4,62px);justify-content:space-between;margin-top:26px}
.dock{margin:auto -10px 30px;height:92px;border-radius:32px;background:var(--line);display:grid;grid-template-columns:repeat(4,62px);justify-content:space-evenly;align-items:center}
.dock .app{background:var(--paper)}
.w-name{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px}
.lock{background:var(--ink);color:var(--paper);box-shadow:0 0 0 8px var(--ink),0 0 0 9px var(--line),0 40px 70px -30px rgba(47,58,46,.45)}
.lock .status{color:var(--paper)}
.lock .island{background:var(--ink);box-shadow:inset 0 0 0 1px var(--muted)}
.lock-date{text-align:center;margin-top:34px;font-size:18px;font-weight:500}
.lock-time{text-align:center;font-family:var(--serif);font-weight:500;font-size:96px;line-height:1;margin-top:2px;letter-spacing:-.02em}
.lock-w{display:flex;justify-content:center;gap:14px;margin-top:18px}
.lw-round{width:72px;height:72px;position:relative}
.lw-round svg{width:72px;height:72px}
.lw-round span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.lw-rect{width:190px;height:72px;border-radius:18px;background:rgba(251,248,242,.10);display:flex;align-items:center;gap:12px;padding:0 14px}
.lw-rect svg{width:34px;height:34px;flex:none}
.lw-rect b{display:block;font-family:var(--serif);font-weight:500;font-size:20px}
.lw-rect span{font-size:12.5px;color:var(--line)}
.lock-bottom{margin-top:auto;display:flex;justify-content:space-between;padding:0 46px 44px}
.lock-bottom i{width:50px;height:50px;border-radius:50%;background:rgba(251,248,242,.14);display:flex;align-items:center;justify-content:center}
.lock .home-ind{background:var(--paper)}

/* ---------- animations: ≤1.5 s, play once, last keyframe = still pose ---------- */
:root{--io:cubic-bezier(.45,0,.3,1);--out:cubic-bezier(.2,.7,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--fall:cubic-bezier(.55,0,1,.45)}
.play .blink{animation:blink 1.4s var(--io) both}
@keyframes blink{0%,72%{transform:none}78%{transform:scaleY(.1)}86%,100%{transform:none}}

.play .pf-all{animation:pfFly 1.1s var(--io) both}
@keyframes pfFly{
  0%{transform:translate(-80px,8px) scale(1.18,.86);opacity:0;animation-timing-function:var(--out)}
  12%{opacity:1}
  45%{transform:translate(5px,-3px) scale(.93,1.07);opacity:1;animation-timing-function:var(--spring)}
  70%{transform:translate(-1px,1px) scale(1.02,.98);animation-timing-function:var(--io)}
  100%{transform:none;opacity:1}}
.play .pf-speed{animation:pfSpeed .9s cubic-bezier(.3,0,.2,1) both}
@keyframes pfSpeed{0%,25%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:none}}

.play .ps-body{animation:psBreath 1.5s var(--io) both}
@keyframes psBreath{
  0%{transform:none}
  20%{transform:scale(1.03,.96);animation-timing-function:var(--spring)}
  55%{transform:scale(.97,1.05);animation-timing-function:var(--io)}
  80%{transform:scale(1.01,.99)}
  100%{transform:none}}
.play .ps-mouth{animation:psMouth 1.5s var(--io) both}
@keyframes psMouth{0%,25%{transform:none}55%{transform:scale(1.35)}100%{transform:none}}
.play .ps-z1{animation:zUp .85s .35s var(--spring) both}
.play .ps-z2{animation:zUp .85s .45s var(--spring) both}
@keyframes zUp{from{opacity:0;transform:translate(-8px,10px) scale(.4)}to{opacity:1;transform:none}}

.play .pt-body{animation:ptSigh 1.5s var(--io) both}
@keyframes ptSigh{
  0%{transform:none}
  22%{transform:translateY(-2px) scale(.98,1.03);animation-timing-function:cubic-bezier(.5,0,.2,1)}
  52%{transform:translateY(3px) scale(1.03,.95);animation-timing-function:var(--spring)}
  75%{transform:translateY(-1px) scale(.99,1.01);animation-timing-function:var(--io)}
  100%{transform:none}}
.play .pt-blink{animation:ptBlink 1.5s var(--io) both}
@keyframes ptBlink{0%,42%{transform:none}54%,72%{transform:scaleY(.1)}86%,100%{transform:none}}
.pt-puff{opacity:0}
.play .pt-puff{animation:ptPuff 1.5s cubic-bezier(.25,.8,.4,1) both}
@keyframes ptPuff{0%,45%{opacity:0;transform:scale(.6)}62%{opacity:1}100%{opacity:0;transform:translateX(-14px) scale(1.2)}}

.play .mc-top{animation:mcDrop 1.4s both}
@keyframes mcDrop{
  0%{opacity:0;transform:translateY(-40px);animation-timing-function:var(--fall)}
  8%{opacity:1}
  25%{transform:none;animation-timing-function:var(--out)}
  33%{transform:translateY(-4px);animation-timing-function:var(--fall)}
  42%,100%{transform:none;opacity:1}}
.play .mc-all{animation:mcSquash 1.4s var(--io) both}
@keyframes mcSquash{
  0%,24%{transform:none;animation-timing-function:var(--out)}
  32%{transform:scale(1.06,.92);animation-timing-function:var(--spring)}
  50%{transform:scale(.97,1.04);animation-timing-function:var(--io)}
  68%{transform:scale(1.01,.99)}
  100%{transform:none}}
.play .mc-relax{animation:mcRelax 1.4s var(--io) both}
@keyframes mcRelax{
  0%{transform:none}
  25%{transform:translateY(-2px) scale(.97,1.05);animation-timing-function:cubic-bezier(.5,0,.2,1)}
  50%{transform:scale(1.03,.97);animation-timing-function:var(--spring)}
  72%{transform:scale(.99,1.01);animation-timing-function:var(--io)}
  100%{transform:none}}
.play .mc-wob{animation:mcWob 1.4s var(--io) both}
@keyframes mcWob{0%,30%{transform:none}46%{transform:rotate(-3deg)}63%{transform:rotate(2deg)}80%{transform:rotate(-.8deg)}100%{transform:none}}
.play .mc-wob.heavy{animation-name:mcWobH}
@keyframes mcWobH{0%,30%{transform:none}46%{transform:rotate(-6deg)}63%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}100%{transform:none}}
.play .mc-shake{animation:mcShake 1.4s cubic-bezier(.45,0,.55,1) both}
@keyframes mcShake{0%,30%{transform:none}35%{transform:translateX(-1.6px)}41%{transform:translateX(1.6px)}47%{transform:translateX(-1.4px)}53%{transform:translateX(1.2px)}59%{transform:translateX(-1px)}66%{transform:translateX(.7px)}74%{transform:translateX(-.4px)}84%{transform:translateX(.2px)}100%{transform:none}}
.play .mc-squeeze{animation:mcSqueeze 1.4s var(--io) both}
@keyframes mcSqueeze{0%,24%{transform:none}34%{transform:scale(1.1,.6)}55%,100%{transform:none}}
.play .mc-drop{animation:mcSweat 1.4s both}
@keyframes mcSweat{
  0%,30%{transform:none;opacity:1;animation-timing-function:var(--fall)}
  55%{transform:translateY(22px);opacity:0}
  56%{transform:scale(0);opacity:0;animation-timing-function:var(--spring)}
  62%{opacity:1}
  85%{transform:scale(1.1)}
  100%{transform:none;opacity:1}}

.play .cl-body{animation:clBody 1.3s var(--io) both}
@keyframes clBody{
  0%{transform:none}
  15%{transform:scale(1.04,.94);animation-timing-function:var(--spring)}
  45%{transform:scale(.96,1.06);animation-timing-function:var(--io)}
  70%{transform:scale(1.01,.99)}
  100%{transform:none}}
.pf-idle{stroke:var(--ink);opacity:0}
.pf-idle path{opacity:0}
.idle .pf-speed{display:none}
.idle .pf-idle{opacity:1}
.idle .pf-idle path{animation:idleLine 2.4s 1.2s cubic-bezier(.3,0,.4,1) infinite}
.idle .pf-idle path:nth-child(2){animation-delay:2s}
.idle .pf-idle path:nth-child(3){animation-delay:2.8s}
@keyframes idleLine{0%{opacity:0;transform:none}25%{opacity:.3}100%{opacity:0;transform:translateX(-26px)}}
.idle .pf-hover{animation:hover 3.2s 1.2s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes hover{from{transform:none}to{transform:translateY(-1.5px)}}

.play .cl-body.storm{animation:clRumble 1.1s cubic-bezier(.45,0,.55,1) both}
.play .storm .puff{animation-duration:1s}
@keyframes clRumble{0%{transform:none}8%{transform:translateX(-1.6px) scale(1.02,.98)}16%{transform:translateX(1.6px)}24%{transform:translateX(-1.3px)}32%{transform:translateX(1.1px)}42%{transform:translateX(-.8px)}54%{transform:translateX(.5px)}68%{transform:translateX(-.2px)}100%{transform:none}}
.play .cl-rain path{animation:rain .55s var(--fall) 2 both}
.play .cl-rain path:nth-child(2){animation-delay:.08s}.play .cl-rain path:nth-child(3){animation-delay:.16s}.play .cl-rain path:nth-child(4){animation-delay:.04s}
@keyframes rain{0%{transform:none;opacity:1}70%{transform:translate(-3px,10px);opacity:0}71%{transform:translateY(-5px);opacity:0}100%{transform:none;opacity:1}}
.play .cl-bolt{animation:bolt 1s var(--io) both}

<script>
const I='#2F3A2E',T='#C47A57',P='#FBF8F2',N='#D9D1C1',M='#6E6A5E';
const o=(x,y)=>`style="transform-origin:${x}px ${y}px"`;
const S=`fill="none" stroke="${I}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
const svg=(vb,body,label)=>`<svg viewBox="${vb}" role="img" aria-label="${label}"><g ${S}>${body}</g></svg>`;
const dot=(x,y,r=3,c=I)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="none"/>`;

const kt=n=>Array.from({length:n},(_,i)=>+(i/(n-1)).toFixed(3)).join(';');
// SMIL path morphs: every keyframe must keep the same command list, the last value is the still pose
const anim=(vals,dur,delay=0,times)=>`<animate attributeName="d" values="${vals.join(';')}" keyTimes="${times||kt(vals.length)}" calcMode="spline" keySplines="${Array(vals.length-1).fill('.42 0 .3 1').join(';')}" dur="${dur}s" begin="indefinite" fill="freeze" data-d="${delay}"/>`;
const morph=(vals,dur,delay,times,attrs='')=>`<path ${attrs} d="${vals[vals.length-1]}">${anim(vals,dur,delay,times)}</path>`;
const qd=f=>`M${f[0]} ${f[1]}Q${f[2]} ${f[3]} ${f[4]} ${f[5]}`;
const hd=f=>`M${f[4]} ${f[5]}h.01`;
const limb=(fr,dur,delay=0,times)=>({
  arm:morph(fr.map(qd),dur,delay,times),
  hand:morph(fr.map(hd),dur,delay,times,'stroke-width="9"')+morph(fr.map(hd),dur,delay,times,`stroke="${P}" stroke-width="5"`),
});
const mir=(f,w)=>[w-f[0],f[1],w-f[2],f[3],w-f[4],f[5]];

const draw={
  patch(state,crop){
    if(state==='fly'){
      const capeR='M86 44C66 36 48 44 28 38C34 50 30 62 38 72C54 68 68 74 86 70Z';
      const cape=[capeR,'M86 44C64 42 40 46 14 46C20 52 18 58 22 64C44 64 66 68 86 70Z','M86 44C70 30 52 40 30 30C36 44 32 58 40 66C54 60 70 72 86 70Z','M86 44C66 44 50 30 26 40C32 52 28 64 36 76C52 76 66 66 86 70Z','M86 44C68 38 48 40 28 34C34 48 30 60 38 70C54 70 68 70 86 70Z','M86 44C66 38 48 42 28 40C34 52 30 63 38 73C54 67 68 74 86 70Z',capeR];
      const arm=limb([[166,56,178,51,191,44],[166,56,180,56,195,51],[166,56,178,46,191,36],[166,56,179,53,192,47],[166,56,178,51,191,44]],1.3,.04,'0;.25;.5;.72;1');
      const lt='0;.25;.5;.72;1';
      const legL=[[100,88,94,98,84,102],[100,88,90,94,78,96],[100,88,98,100,88,106],[100,88,93,97,83,101],[100,88,94,98,84,102]];
      const legR=[[114,88,108,100,98,104],[114,88,104,96,92,98],[114,88,112,102,102,108],[114,88,107,99,97,103],[114,88,108,100,98,104]];
      return svg(crop?'0 26 220 86':'0 -5 220 150',`
      <path class="pf-speed" stroke="${N}" d="M6 52h14M12 62h12M18 86h16"/>
      <g class="pf-idle" stroke-width="1.5"><path d="M34 52h14"/><path d="M40 64h12"/><path d="M30 80h16"/></g>
      <g class="pf-hover">
      <g class="pf-all" ${o(126,65)}>

  if(el.classList.contains('idle')) startIdle(el,1.5);};
// the idle cape morph must begin after the entrance morph, otherwise the frozen entrance value wins the SMIL priority
const startIdle=(el,delay)=>el.querySelectorAll('.idle-anim').forEach(a=>a.beginElementAt(delay));
if(!reduce) document.querySelectorAll('[data-idle]').forEach(el=>{el.classList.add('idle');startIdle(el,el.hasAttribute('data-auto')?1.5:0);});
document.addEventListener('click',e=>{
  const host=e.target.closest('.ch-host');
  const el=host?host.querySelector('.ch'):e.target.closest('.ch');
  if(el && !el.closest('.breathing')) play(el);
});
const io=new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting){io.unobserve(en.target); if(!reduce) play(en.target);}
}),{threshold:.6});
document.querySelectorAll('.ch[data-auto]').forEach(el=>io.observe(el));

document.getElementById('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c) c.classList.toggle('on');
});
const labels=['Légère','Présente','Bien là','Forte','Très forte'];
document.querySelectorAll('#clouds .cl-opt').forEach((opt,i)=>opt.addEventListener('click',()=>{
  document.querySelectorAll('#cloud-labels .cl-lbl').forEach((l,j)=>l.textContent=j===i?labels[i]:'');
}));

(()=>{
  const box=document.querySelector('#breathe .breath'), btn=document.getElementById('breathe-btn');
  const out=box.querySelector('.cloud-out'), crossed=box.querySelector('.crossed');
  const timer=document.querySelector('#breathe .timer'), phase=document.querySelector('#breathe .phase');
  const cloud=box.querySelector('.ch');
  const setLv=lv=>{cloud.innerHTML=draw.cloud(lv);play(cloud);};
  let tick=null, left=600, scale=1, lv=3;
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const stop=()=>{
    clearInterval(tick); tick=null; box.classList.remove('breathing');
    if(lv){lv=0;setLv(0);}
    out.style.transform=`translateY(-150px) scale(${scale*.6})`; out.classList.add('away'); crossed.classList.add('show');
    btn.textContent='Lancer 10 minutes'; phase.textContent='Bien joué · elle est passée';
  };
  btn.addEventListener('click',()=>{
    if(tick) return stop();
    left=600; scale=1; lv=3; setLv(3); out.classList.remove('away'); out.style.transform=''; crossed.classList.remove('show');
    box.classList.add('breathing'); btn.textContent="J'ai fini"; timer.textContent=fmt(left);
    let t=0; phase.textContent='Inspire…';
    tick=setInterval(()=>{
      t++; left--; timer.textContent=fmt(left);
      phase.textContent=(t%10)<4?'Inspire…':'Expire…';
      if(t%10===0){scale=Math.max(.45,scale*.85); out.style.transform=`scale(${scale})`; if(lv){lv--;setLv(lv);}}
      if(left<=0) stop();
    },1000);
  });
})();
</script>
</body>
</html>
