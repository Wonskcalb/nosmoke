name: NoSmoke
options:
  bundleIdPrefix: fr.famelart
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: HH4W7S832V
targets:
  NoSmoke:
    type: application
    platform: iOS
    sources: [NoSmoke, Shared]
    dependencies:
      - target: NoSmokeWidgets
    entitlements:
      path: NoSmoke/NoSmoke.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.famelart.nosmoketracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.famelart.nosmoketracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: NoSmoke
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
  NoSmokeWidgets:
    type: app-extension
    platform: iOS
    sources: [NoSmokeWidgets, Shared]
    info:
      path: NoSmokeWidgets/Info.plist
      properties:
        CFBundleDisplayName: NoSmoke
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NoSmokeWidgets/NoSmokeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.famelart.nosmoketracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.famelart.nosmoketracker.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  NoSmokeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NoSmokeTests]
    dependencies:
      - target: NoSmoke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.famelart.nosmoketracker.tests
schemes:
  NoSmoke:
    build:
      targets:
        NoSmoke: all
    test:
      targets: [NoSmokeTests]
