name: NoSmoke
options:
  bundleIdPrefix: fr.famelart
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NoSmoke:
    type: application
    platform: iOS
    sources: [NoSmoke]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.famelart.nosmoke
        INFOPLIST_KEY_CFBundleDisplayName: NoSmoke
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
  NoSmokeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NoSmokeTests]
    dependencies:
      - target: NoSmoke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.famelart.nosmoke.tests
schemes:
  NoSmoke:
    build:
      targets:
        NoSmoke: all
    test:
      targets: [NoSmokeTests]
